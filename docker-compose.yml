services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tt1}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    # Puerto host de inspeccion. 5433 por defecto para no chocar con un
    # Postgres local en 5432. PostgREST conecta por la red interna (db:5432).
    ports: ["${DB_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tt1}"]
      interval: 5s
      timeout: 5s
      retries: 10
  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${AUTH_PASSWORD:-authpass}@db:5432/${POSTGRES_DB:-tt1}
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: anon
      PGRST_SERVER_PORT: 3000
    ports: ["3000:3000"]
  swagger:
    image: swaggerapi/swagger-ui
    depends_on: [postgrest]
    environment: { API_URL: "http://localhost:3000/" }
    ports: ["8080:8080"]
volumes:
  db_data:
